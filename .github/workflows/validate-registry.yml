name: Validate construct registry

on:
  push:
    paths:
      - "data/**"
      - "schemas/**"
      - "scripts/validate-registry.mjs"
      - "package.json"
  pull_request:
    paths:
      - "data/**"
      - "schemas/**"
      - "scripts/validate-registry.mjs"
      - "package.json"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
